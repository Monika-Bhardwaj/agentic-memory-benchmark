# Causal memory evaluation — development configuration
# Uses mock model for instrument validation. No research claims.
experiment:
  name: causal_dev_v1
  benchmark_version: v1
  phase: dev
  seeds: [42, 7, 2024]
  tasks_subset: []
  systems:
    - no_memory
    - naive_retrieval
    - structured_memory
    - sacam_v1
    - full_context
  results_dir: results

model:
  name: mock_pattern_reader
  temperature: 0
  max_output_tokens: 512

prompt_version: v1-p1

memory:
  retrieval_top_k: 3
  memory_budget_items: 512
  full_context_top_k: all
  sacam_weights: {superseded: 0.1, untrusted: 0.1, recency: 0.2}

evaluation:
  primary_metric: tsr
  mme: 0.05
  retention_tolerance: -0.05
  compute_causal_estimands: true
  compute_counterfactual_consistency: true

harness:
  respond_to_non_query_events: false
  timeout_seconds: 60
  max_retries: 0
