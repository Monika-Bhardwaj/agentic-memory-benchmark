# SACAM v0.2 A/B — provenance-aware supersession fix (adversarial + stale axes).
# The two categories where v0.1 mechanics were shown to misfire (see research_review.md):
# adversarial (v0 collapsed to 0.07) and stale_conflict (v0 = 0.45 vs structured 0.88).
# Subset: 8 adversarial + 8 stale tasks; 5 systems incl. sacam_v1; 3 seeds.
# NOTE: E-rule rows evaluate the named --primary subject (sacam_v1) on this task subset;
# a subset verdict is directional, not the frozen full-run verdict.
experiment:
  name: sacam_v1_ab_adv_stale
  benchmark_version: v0.1
  phase: full
  seeds: [42, 7, 2024]
  tasks_subset:
    - E_ADS_01
    - E_ADS_02
    - E_ADS_03
    - E_ADS_04
    - E_ADS_05
    - E_ADS_06
    - E_ADS_07
    - E_ADS_08
    - C_STL_01
    - C_STL_02
    - C_STL_03
    - C_STL_04
    - C_STL_05
    - C_STL_06
    - C_STL_07
    - C_STL_08
  systems:
    - naive_retrieval
    - structured_memory
    - sacam_v0
    - sacam_v1
    - full_context
  results_dir: results

model:
  name: gpt-4.1-mini
  temperature: 0
  max_output_tokens: 512

prompt_version: v0.1-p1

memory:
  retrieval_top_k: 3
  memory_budget_items: 512
  full_context_top_k: all
  sacam_weights: {superseded: 0.1, untrusted: 0.1, recency: 0.2}

evaluation:
  primary_metric: tsr
  mme: 0.05
  retention_tolerance: -0.05

harness:
  respond_to_non_query_events: false
  timeout_seconds: 60
  max_retries: 1