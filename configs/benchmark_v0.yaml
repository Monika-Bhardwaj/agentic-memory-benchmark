# SACAM v0.1 — full pre-registered benchmark experiment (40 tasks, all systems).
# Intended for the live model. FROZEN; no tuning on these results.
experiment:
  name: sacam_full_v01
  benchmark_version: v0.1
  phase: full
  seeds: [42, 7, 2024, 1337, 2718]
  tasks_subset: []
  systems:
    - no_memory
    - naive_retrieval
    - structured_memory
    - sacam_v0
    - full_context
  results_dir: results

model:
  name: gpt-4.1-mini
  temperature: 0
  max_output_tokens: 512

prompt_version: v0.1-p1

memory:
  retrieval_top_k: 3
  memory_budget_items: 512
  full_context_top_k: all
  sacam_weights: {superseded: 0.1, untrusted: 0.1, recency: 0.2}

evaluation:
  primary_metric: tsr
  mme: 0.05
  retention_tolerance: -0.05

harness:
  respond_to_non_query_events: false
  timeout_seconds: 60
  max_retries: 1